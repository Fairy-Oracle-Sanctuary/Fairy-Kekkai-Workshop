name: Release

# 打 tag 时发布 GitHub Release（tag 名即版本号，如 v2.5.1）
# 例：git tag v2.5.1 && git push origin v2.5.1
# 发布说明从仓库根 RELEASE_NOTES.md 读取，缺失时使用自动生成内容
on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows ${{ matrix.variant }} Installer
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # PADDLEOCR 标识文件第一行决定软件读取到的 OCR 版本（setting.py 编译期内联），
          # variant 对应安装包文件名后缀（见 RELEASE_NOTES.md 命名约定），
          # paddleocr_asset 是 timminator/PaddleOCR-Standalone 实际发布的资产名
          # （timminator 最新公开版为 v1.4.0，下载解压后重命名为 v1.5.1 目录名）
          - paddleocr_tag: PaddleOCR-CPU-v1.5.1
            variant: CPU-v1.5.1
            paddleocr_asset: PaddleOCR-CPU-v1.4.0.7z
          - paddleocr_tag: PaddleOCR-GPU-v1.5.1-CUDA-11.8
            variant: GPU-v1.5.1-CUDA-11.8
            paddleocr_asset: PaddleOCR-GPU-v1.4.0-CUDA-11.8.7z
          - paddleocr_tag: PaddleOCR-GPU-v1.5.1-CUDA-12.9
            variant: GPU-v1.5.1-CUDA-12.9
            paddleocr_asset: PaddleOCR-GPU-v1.4.0-CUDA-12.9.7z
          # Clear 增量升级包：仅供已安装旧版本的用户升级主程序，
          # 不向构建目录复制 tools 与 PADDLEOCR，直接打包为 iss
          - paddleocr_tag: ""
            variant: Clear
            paddleocr_asset: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Download Inno Setup translations
        # choco 装的官方 Inno Setup 只带部分翻译，缺简体中文等语言。
        # 通过 GitHub API 拉取 issrc 仓库 Files/Languages 目录下的全部 .isl，
        # 再把 Unofficial 子目录中不与根目录重名的 .isl 也拉下来，尽量支持更多语言。
        # .iss 里的 EmitLanguagesSection 会自动包含它们
        run: |
          $langDir = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\Languages"
          New-Item -ItemType Directory -Force -Path $langDir | Out-Null
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          # 官方翻译（根目录）
          $files = Invoke-RestMethod "https://api.github.com/repos/jrsoftware/issrc/contents/Files/Languages"
          $islFiles = $files | Where-Object { $_.type -eq "file" -and $_.name -like "*.isl" }
          foreach ($f in $islFiles) {
            curl.exe -L -s -o (Join-Path $langDir $f.name) $f.download_url
          }

          # unofficial 翻译（Unofficial 子目录），跳过与根目录重名的文件
          $unofficial = Invoke-RestMethod "https://api.github.com/repos/jrsoftware/issrc/contents/Files/Languages/Unofficial"
          $existing = @($islFiles.name)
          foreach ($f in $unofficial | Where-Object { $_.type -eq "file" -and $_.name -like "*.isl" }) {
            if ($f.name -notin $existing) {
              curl.exe -L -s -o (Join-Path $langDir $f.name) $f.download_url
            }
          }
          Write-Host "Installed translations: $((Get-ChildItem $langDir -Filter *.isl).Count)"

      - name: Set PaddleOCR version marker
        # setting.py 在 nuitka 编译期读取根目录 PADDLEOCR 文件第一行并内联为常量，
        # 因此必须在 python deploy.py 之前写入对应版本的标识（纯 ASCII，避免 UTF-8 BOM）
        # Clear 增量升级包不写标识，保持仓库文件原样
        if: matrix.paddleocr_tag != ''
        run: |
          Set-Content -Path PADDLEOCR -Value "${{ matrix.paddleocr_tag }}" -Encoding ascii -NoNewline
          Write-Host "PADDLEOCR marker: $(Get-Content PADDLEOCR)"

      - name: Download PaddleOCR engine
        # 引擎来自 timminator/PaddleOCR-Standalone 的 v1.4.0 Release，
        # 下载解压后重命名为 v1.5.1 目录名（与本地产物 tools/ 结构一致）
        # Clear 增量升级包不下载
        if: matrix.paddleocr_asset != ''
        run: |
          $asset = "${{ matrix.paddleocr_asset }}"
          $target = "tools\${{ matrix.paddleocr_tag }}"
          New-Item -ItemType Directory -Force -Path downloads, tools | Out-Null
          curl.exe -L -o "downloads\$asset" "https://github.com/timminator/PaddleOCR-Standalone/releases/download/v1.4.0/$asset"
          & "C:\Program Files\7-Zip\7z.exe" x "downloads\$asset" "-odownloads\paddle" -y | Out-Null
          $items = @(Get-ChildItem downloads\paddle -Force)
          if ($items.Count -eq 1 -and $items[0].PSIsContainer) {
            Move-Item $items[0].FullName $target -Force
          } else {
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            Get-ChildItem downloads\paddle -Force | Move-Item -Destination $target -Force
          }
          Write-Host "PaddleOCR engine installed at $target"

      - name: Download PaddleOCR support files
        # PP-OCRv5 推理模型，CPU/GPU 三个变体共用；同样来自 timminator v1.4.0
        # Clear 增量升级包不下载
        if: matrix.paddleocr_asset != ''
        run: |
          $asset = "PaddleOCR.PP-OCRv5.support.files.VideOCR.7z"
          $target = "tools\PaddleOCR.PP-OCRv5.support.files"
          New-Item -ItemType Directory -Force -Path downloads | Out-Null
          curl.exe -L -o "downloads\$asset" "https://github.com/timminator/PaddleOCR-Standalone/releases/download/v1.4.0/$asset"
          & "C:\Program Files\7-Zip\7z.exe" x "downloads\$asset" "-odownloads\support" -y | Out-Null
          $items = @(Get-ChildItem downloads\support -Force)
          if ($items.Count -eq 1 -and $items[0].PSIsContainer) {
            Move-Item $items[0].FullName $target -Force
          } else {
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            Get-ChildItem downloads\support -Force | Move-Item -Destination $target -Force
          }
          Write-Host "Support files installed at $target"

      - name: Download videocr-cli and whisper
        # videocr-cli.exe 与 whisper 工具来自本项目历史 Release v2.0.0 的压缩包资产
        # Clear 增量升级包不下载
        if: matrix.paddleocr_asset != ''
        run: |
          New-Item -ItemType Directory -Force -Path downloads, tools\whisper | Out-Null
          $base = "https://github.com/Fairy-Oracle-Sanctuary/Fairy-Kekkai-Workshop/releases/download/v2.0.0"
          curl.exe -L -o downloads\videocr-cli.zip "$base/videocr-cli.zip"
          curl.exe -L -o downloads\whisper.zip "$base/whisper.zip"
          Expand-Archive downloads\videocr-cli.zip -DestinationPath downloads\videocr -Force
          $videocr = Get-ChildItem downloads\videocr -Recurse -Filter videocr-cli.exe | Select-Object -First 1
          if (-not $videocr) { Write-Error "videocr-cli.zip 中未找到 videocr-cli.exe"; exit 1 }
          Move-Item $videocr.FullName tools\videocr-cli.exe -Force
          Expand-Archive downloads\whisper.zip -DestinationPath downloads\whisper -Force
          Get-ChildItem downloads\whisper -Recurse -File | ForEach-Object {
            Copy-Item $_.FullName "tools\whisper\$($_.Name)" -Force
          }
          Write-Host "tools\whisper: $((Get-ChildItem tools\whisper -File | ForEach-Object { $_.Name }) -join ', ')"
          Write-Host "videocr-cli.exe: $([math]::Round((Get-Item tools\videocr-cli.exe).Length / 1MB, 1)) MB"

      - name: Download ffmpeg and yt-dlp
        # ffmpeg 优先从 gyan.dev 获取（GitHub Actions 数据中心可能被 Cloudflare 拦截，
        # 失败时自动重试并回退到 BtbN 的 GitHub Release 镜像）；yt-dlp 从其官方 Release 获取
        # Clear 增量升级包不下载
        if: matrix.paddleocr_asset != ''
        run: |
          New-Item -ItemType Directory -Force -Path tools | Out-Null

          function Download-WithRetry {
              param(
                  [string]$Url,
                  [string]$OutFile,
                  [int]$Attempts = 3,
                  [int]$MinBytes = 1MB
              )
              for ($i = 1; $i -le $Attempts; $i++) {
                  Write-Host "[$i/$Attempts] Downloading $Url"
                  curl.exe -L --fail -o $OutFile $Url
                  if (Test-Path $OutFile) {
                      $size = (Get-Item $OutFile).Length
                      if ($size -ge $MinBytes) {
                          Write-Host "OK: $([math]::Round($size / 1MB, 1)) MB"
                          return $true
                      }
                      Write-Host "File too small ($size bytes), likely an error page; retrying..."
                      Remove-Item $OutFile -Force -ErrorAction SilentlyContinue
                  }
                  Start-Sleep -Seconds 5
              }
              Write-Host "FAILED: $Url"
              return $false
          }

          # ffmpeg：gyan.dev 为主源，BtbN GitHub Release 为回退源
          $ffmpegOk = $false
          foreach ($src in @(
              "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip",
              "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          )) {
              if (Download-WithRetry -Url $src -OutFile ffmpeg.zip -MinBytes 10MB) {
                  $ffmpegOk = $true
                  break
              }
          }
          if (-not $ffmpegOk) {
              Write-Error "ffmpeg 下载失败：gyan.dev 与 BtbN 镜像均不可用"
              exit 1
          }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extracted -Force
          $ff = Get-ChildItem ffmpeg-extracted -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ff) {
              Write-Error "ffmpeg 压缩包中未找到 ffmpeg.exe"
              exit 1
          }
          Copy-Item $ff.FullName tools\ffmpeg.exe -Force
          Remove-Item ffmpeg.zip, ffmpeg-extracted -Recurse -Force

          # yt-dlp：官方 Release，失败重试
          if (-not (Download-WithRetry -Url "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile tools\yt-dlp.exe -MinBytes 5MB)) {
              Write-Error "yt-dlp 下载失败"
              exit 1
          }

          Write-Host "ffmpeg.exe: $([math]::Round((Get-Item tools\ffmpeg.exe).Length / 1MB, 1)) MB"
          Write-Host "yt-dlp.exe: $([math]::Round((Get-Item tools\yt-dlp.exe).Length / 1MB, 1)) MB"

      - name: Build
        # deploy.py 执行 nuitka 打包，并在编译后自动调用 cleanup_dist 清理无用 Qt 插件
        run: python deploy.py

      - name: Verify bundled files
        # 打包安装包前确认主 exe 已生成，缺失则立即失败并给出明确原因
        run: |
          if (-not (Test-Path dist\Fairy-Kekkai-Workshop.dist\Fairy-Kekkai-Workshop.exe)) {
            Write-Error "dist 中缺少 Fairy-Kekkai-Workshop.exe，nuitka 打包失败"
            exit 1
          }
          $exe = Get-Item dist\Fairy-Kekkai-Workshop.dist\Fairy-Kekkai-Workshop.exe
          Write-Host "exe: $([math]::Round($exe.Length / 1MB, 1)) MB"
          $total = (Get-ChildItem dist\Fairy-Kekkai-Workshop.dist -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host "dist total: $([math]::Round($total / 1MB, 1)) MB"
          # 与本地产物结构保持一致：把版本标识文件一并放进 dist（Clear 增量升级包不带）
          if ("${{ matrix.paddleocr_tag }}" -ne "") {
            Copy-Item -Path PADDLEOCR -Destination dist\Fairy-Kekkai-Workshop.dist\PADDLEOCR -Force
            Write-Host "dist marker: $(Get-Content dist\Fairy-Kekkai-Workshop.dist\PADDLEOCR)"
          }

      - name: Copy tools into dist
        # 把下载好的 tools 一并放进 dist，由 .iss 的 recursesubdirs 递归打进安装包
        # （Whisper.model 由用户自行下载，不包含；Clear 增量升级包不拷贝）
        if: matrix.paddleocr_asset != ''
        run: |
          New-Item -ItemType Directory -Force -Path dist\Fairy-Kekkai-Workshop.dist\tools | Out-Null
          Copy-Item -Path tools\* -Destination dist\Fairy-Kekkai-Workshop.dist\tools -Recurse -Force
          Write-Host "dist tools: $((Get-ChildItem dist\Fairy-Kekkai-Workshop.dist\tools -Force | ForEach-Object { $_.Name }) -join ', ')"
          $toolsTotal = (Get-ChildItem dist\Fairy-Kekkai-Workshop.dist\tools -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host "dist tools total: $([math]::Round($toolsTotal / 1MB, 1)) MB"
          # 释放下载临时文件，避免磁盘占用过高
          Remove-Item downloads -Recurse -Force -ErrorAction SilentlyContinue

      - name: Build installer (Inno Setup)
        # 版本号与 OCR 变体通过 /D 传入，.iss 输出到 Output 子目录，文件名带版本号
        run: |
          $ver = python -c "from app.common.setting import VERSION; print(VERSION)"
          Write-Host "Installer version: $ver, variant: ${{ matrix.variant }}"
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Error "未找到 ISCC.exe: $iscc"
            exit 1
          }
          & $iscc "/DMyAppVersion=$ver" "/DMyVariant=${{ matrix.variant }}" "Fairy-Kekkai-Workshop.iss"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fairy-Kekkai-Workshop-${{ matrix.variant }}-Windows-x86_64
          # ISCC 输出到 .iss 中 OutputDir 指定的 Output 子目录，文件名带版本号
          path: Output/Fairy-Kekkai-Workshop-v*-Windows-x86_64-Setup.exe
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify version matches tag
        # 防止 tag 与 app/common/setting.py 的 VERSION 不一致导致产物版本错乱
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION=$(python3 -c "from app.common.setting import VERSION; print(VERSION)")
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (version $TAG_VERSION) does not match app VERSION ($APP_VERSION). Update app/common/setting.py and re-tag."
            exit 1
          fi
          echo "Version OK: $APP_VERSION"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Prepare release notes
        # 读取仓库根 RELEASE_NOTES.md；文件缺失时用自动生成内容，避免发布失败
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            cp RELEASE_NOTES.md /tmp/RELEASE_NOTES.md
            echo "Using RELEASE_NOTES.md"
          else
            {
              echo "## Fairy Kekkai Workshop $GITHUB_REF_NAME"
              echo ""
              echo "此 Release 未提供 RELEASE_NOTES.md，已使用自动生成的发布说明。"
            } > /tmp/RELEASE_NOTES.md
            echo "RELEASE_NOTES.md not found, using auto-generated notes"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Fairy Kekkai Workshop ${{ github.ref_name }}
          body_path: /tmp/RELEASE_NOTES.md
          files: release-assets/**
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
