name: Release (C++ Windows Installer)

# C++ 原生版唯一的发布管线：打 tag（v3.0.0 形式）即自动完成
#   预检（版本号 / 发布说明契约）-> 四变体并行构建 -> 校验产物 -> 发布 GitHub Release。
# Python 版的两条旧管线（release.yml / deploy-windows.yml）已下线，不再存在。
#
# 也可以 workflow_dispatch 手工触发：只构建并上传 artifact，不会发布 Release。
#
# 发布前需要满足的契约（细节见 DEVELOPMENT.md「发布与更新约定」）：
#   1. tag 版本号 == cpp/resources/setting_data.json 的 VERSION；
#   2. RELEASE_NOTES.md 含 `## 更新日志`（后面还有别的 `## ` 标题）与 `## 下载提示`，
#      下载提示里 CPU / GPU CUDA 11.8 / GPU CUDA 12.9 / Clear 四个安装包链接齐全；
#   3. 若本次更换了 OCR 引擎，正文末尾必须独占一行 !OCRUPDATE!。
# 前两条由 scripts/check-release-notes.py 校验，第三条由它联网比对上一次 Release
# 的引擎代次自动判定，任何一条不满足都会在编译前直接失败（省掉一次半小时的构建）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 同一 tag 的发布不并发；手工触发按 ref 各自独立
concurrency:
  group: cpp-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve version from setting_data.json
        # C++ 版版本号的唯一来源；安装包文件名与程序内显示都取自它
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('cpp/resources/setting_data.json', encoding='utf-8-sig'))['VERSION'])")
          if [ -z "$VERSION" ]; then
            echo "::error::无法从 cpp/resources/setting_data.json 读取 VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "C++ 版版本号: $VERSION"

      - name: Verify tag matches version
        # 防止 tag 与源码里的版本号不一致，导致发布出的安装包版本错乱
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 cpp/resources/setting_data.json 的 VERSION（${{ steps.version.outputs.version }}）不一致，请先改版本号再打 tag"
            exit 1
          fi
          echo "版本号校验通过: $TAG_VERSION"

      - name: Verify RELEASE_NOTES.md contract
        # 客户端「检查更新」直接解析 Release 正文，格式是有约束的接口：
        # 结构 / 四个安装包链接 / 链接版本号 / 换引擎必须带 !OCRUPDATE!
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/check-release-notes.py \
            --version "${{ steps.version.outputs.version }}" \
            --check-ocr-update

  build:
    name: Build ${{ matrix.variant }}
    needs: [preflight]
    runs-on: windows-2022
    strategy:
      # 四个变体互相独立，一个失败不影响其余，最后统一判定
      fail-fast: false
      matrix:
        variant:
          - CPU-v3.7.0
          - GPU-v3.7.0-CUDA-11.8
          - GPU-v3.7.0-CUDA-12.9
          - Clear
    env:
      # OpenCV 用项目自己 Release 上备用的预编译包（world 版，解压后为 build\）
      OPENCV_ASSET_URL: https://github.com/Fairy-Oracle-Sanctuary/Fairy-Kekkai-Workshop/releases/download/v2.0.0/opencv-4.12.0-windows-x64.zip
      # OCR 引擎与推理模型来自 timminator/PaddleOCR-Standalone，与本机 tools 的 v3.7.0 布局一致
      PADDLEOCR_BASE_URL: https://github.com/timminator/PaddleOCR-Standalone/releases/download/v3.7.0
      SUPPORT_ASSET: PaddleOCR.PP-OCRv6.support.files.VideOCR.7z
      SUPPORT_DIR: PaddleOCR.PP-OCRv6.support.files
      # videocr-cli 与新版 Vulkan Whisper 来自本项目 v2.0.0 的 ZIP 资产
      TOOLS_BASE_URL: https://github.com/Fairy-Oracle-Sanctuary/Fairy-Kekkai-Workshop/releases/download/v2.0.0
      VAD_MODEL_URL: https://huggingface.co/ggml-org/whisper-vad/resolve/main/ggml-silero-v6.2.0.bin
      VAD_MODEL_SHA256: 2aa269b785eeb53a82983a20501ddf7c1d9c48e33ab63a41391ac6c9f7fb6987

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        # Qt 6.7.3 只有 msvc2019_64 归档，与 runner 上的 MSVC 2022 二进制兼容；
        # 6.7.3 的基础包自带 qtsvg（仓库里没有独立的 addons.qtsvg 包），
        # 指定 modules: qtsvg 会让 aqt 找不到包而报错，因此不传 modules。
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          arch: win64_msvc2019_64
          cache: true

      - name: Locate Qt
        # 由 PATH 里的 qmake 反推 Qt 根目录（windeployqt 在 <root>\bin 下），
        # 避免依赖 install-qt-action 的环境变量命名。
        run: |
          $qmake = (Get-Command qmake -ErrorAction SilentlyContinue).Source
          if (-not $qmake) { $qmake = (Get-Command qmake6 -ErrorAction SilentlyContinue).Source }
          $qtRoot = ''
          if ($qmake) { $qtRoot = Split-Path (Split-Path $qmake -Parent) -Parent }
          if (-not $qtRoot -and $env:QT_ROOT_DIR) { $qtRoot = $env:QT_ROOT_DIR }
          if (-not $qtRoot) { Write-Error '无法定位 Qt 根目录'; exit 1 }
          if (-not (Test-Path (Join-Path $qtRoot 'bin\windeployqt.exe'))) {
            Write-Error "Qt 根目录下没有 windeployqt.exe: $qtRoot"; exit 1
          }
          "QT_ROOT=$qtRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Qt root: $qtRoot"

      - name: Resolve CMake generator
        # CMake 的生成器名必须与镜像里实际安装的 Visual Studio 主版本对应，
        # 否则报 "could not find any instance of Visual Studio"。
        # 用 vswhere 探测后再映射，镜像换 VS 版本（2022 <-> 2026）时无需改 workflow。
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $generator = 'Visual Studio 17 2022'
          if (Test-Path $vswhere) {
            $version = & $vswhere -latest -products * `
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
            if (-not $version) { $version = & $vswhere -latest -products * -property installationVersion }
            if ($version) {
              switch ([int]($version.Split('.')[0])) {
                17 { $generator = 'Visual Studio 17 2022' }
                18 { $generator = 'Visual Studio 18 2026' }
                default {
                  Write-Error "未映射的 Visual Studio 主版本: $version，请在 Resolve CMake generator 步骤补充生成器名"
                  exit 1
                }
              }
            }
            Write-Host "vswhere installationVersion: $version"
          } else {
            Write-Host "未找到 vswhere，沿用默认生成器: $generator"
          }
          "CMAKE_GENERATOR=$generator" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "CMake generator: $generator"

      - name: Resolve OCR variant
        # 变体名与 PaddleOCR-Standalone 资产名同构：PaddleOCR-<variant> / PaddleOCR-<variant>.7z
        # Clear 增量升级包不下载也不写 OCR 标识
        run: |
          $variant = "${{ matrix.variant }}"
          $tag = ''
          if ($variant -ne 'Clear') { $tag = "PaddleOCR-$variant" }
          "PADDLEOCR_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "OCR variant: $variant, marker: $tag"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Download Inno Setup translations
        # choco 装的官方 Inno Setup 只带部分翻译，缺简体中文等语言。
        # 通过 GitHub API 拉取 issrc 仓库 Files/Languages 目录下的全部 .isl，
        # 再把 Unofficial 子目录中不与根目录重名的 .isl 也拉下来，尽量支持更多语言。
        # .iss 里的 EmitLanguagesSection 会自动包含它们
        run: |
          $langDir = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\Languages"
          New-Item -ItemType Directory -Force -Path $langDir | Out-Null
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12

          $files = Invoke-RestMethod "https://api.github.com/repos/jrsoftware/issrc/contents/Files/Languages"
          $islFiles = $files | Where-Object { $_.type -eq "file" -and $_.name -like "*.isl" }
          foreach ($f in $islFiles) {
            curl.exe -L -s -o (Join-Path $langDir $f.name) $f.download_url
          }

          $unofficial = Invoke-RestMethod "https://api.github.com/repos/jrsoftware/issrc/contents/Files/Languages/Unofficial"
          $existing = @($islFiles.name)
          foreach ($f in $unofficial | Where-Object { $_.type -eq "file" -and $_.name -like "*.isl" }) {
            if ($f.name -notin $existing) {
              curl.exe -L -s -o (Join-Path $langDir $f.name) $f.download_url
            }
          }
          Write-Host "Installed translations: $((Get-ChildItem $langDir -Filter *.isl).Count)"

      - name: Download OpenCV
        # 解压后是 build\ 目录，其中含根 OpenCVConfig.cmake、include、x64\vc16\{bin,lib}
        run: |
          New-Item -ItemType Directory -Force -Path downloads | Out-Null
          curl.exe -L --fail -o downloads\opencv.zip "$env:OPENCV_ASSET_URL"
          if ($LASTEXITCODE -ne 0) { Write-Error 'OpenCV 压缩包下载失败'; exit 1 }
          & "C:\Program Files\7-Zip\7z.exe" x downloads\opencv.zip "-oopencv" -y | Out-Null
          if (-not (Test-Path 'opencv\build\OpenCVConfig.cmake')) {
            Write-Error 'OpenCV 解压结果缺少 build\OpenCVConfig.cmake'; exit 1
          }
          "OPENCV_DIR=$((Get-Location).Path)\opencv\build" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "OpenCV: $((Get-Location).Path)\opencv\build"

      - name: Download PaddleOCR engine
        # 引擎解压后重命名为 PADDLEOCR 标识对应的目录名（tools\<tag>），与程序运行期查找路径一致
        if: env.PADDLEOCR_TAG != ''
        run: |
          $tag = $env:PADDLEOCR_TAG
          $asset = "$tag.7z"
          $target = "tools\$tag"
          New-Item -ItemType Directory -Force -Path downloads, tools | Out-Null
          curl.exe -L --fail -o "downloads\$asset" "$env:PADDLEOCR_BASE_URL/$asset"
          if ($LASTEXITCODE -ne 0) { Write-Error "PaddleOCR 引擎下载失败: $asset"; exit 1 }
          & "C:\Program Files\7-Zip\7z.exe" x "downloads\$asset" "-odownloads\paddle" -y | Out-Null
          $items = @(Get-ChildItem downloads\paddle -Force)
          if ($items.Count -eq 1 -and $items[0].PSIsContainer) {
            Move-Item $items[0].FullName $target -Force
          } else {
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            Get-ChildItem downloads\paddle -Force | Move-Item -Destination $target -Force
          }
          Write-Host "PaddleOCR engine installed at $target"

      - name: Download PaddleOCR support files
        # PP-OCRv6 推理模型（VideOCR 版），CPU/GPU 三个变体共用
        if: env.PADDLEOCR_TAG != ''
        run: |
          New-Item -ItemType Directory -Force -Path downloads | Out-Null
          curl.exe -L --fail -o "downloads\$env:SUPPORT_ASSET" "$env:PADDLEOCR_BASE_URL/$env:SUPPORT_ASSET"
          if ($LASTEXITCODE -ne 0) { Write-Error "推理模型下载失败: $env:SUPPORT_ASSET"; exit 1 }
          & "C:\Program Files\7-Zip\7z.exe" x "downloads\$env:SUPPORT_ASSET" "-odownloads\support" -y | Out-Null
          $target = "tools\$env:SUPPORT_DIR"
          $items = @(Get-ChildItem downloads\support -Force)
          if ($items.Count -eq 1 -and $items[0].PSIsContainer) {
            Move-Item $items[0].FullName $target -Force
          } else {
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            Get-ChildItem downloads\support -Force | Move-Item -Destination $target -Force
          }
          Write-Host "Support files installed at $target"

      - name: Download Whisper and Silero VAD for all installers
        # Clear 也需要更换 Whisper 引擎；四种包始终带上轻量 VAD 模型。
        run: |
          New-Item -ItemType Directory -Force -Path downloads, tools\whisper, tools\Whisper.model | Out-Null
          curl.exe -L --fail --retry 3 -o downloads\whisper.zip "$env:TOOLS_BASE_URL/whisper.zip"
          if ($LASTEXITCODE -ne 0) { throw 'whisper.zip 下载失败' }
          Expand-Archive downloads\whisper.zip -DestinationPath downloads\whisper -Force
          $executables = @(Get-ChildItem downloads\whisper -Recurse -File -Filter whisper-cli.exe |
            Where-Object { $_.FullName -notmatch '(?i)[\\/](backup[^\\/]*|__MACOSX)[\\/]' })
          if ($executables.Count -ne 1) { throw 'whisper.zip 必须包含唯一的 whisper-cli.exe（不支持旧 main.exe）' }
          $engineRoot = $executables[0].DirectoryName
          foreach ($file in @('whisper-cli.exe', 'whisper.dll', 'ggml.dll', 'ggml-base.dll', 'ggml-cpu.dll', 'ggml-vulkan.dll')) {
            $source = Join-Path $engineRoot $file
            if (-not (Test-Path $source -PathType Leaf)) { throw "whisper.zip 缺少 $file" }
            Copy-Item -LiteralPath $source -Destination tools\whisper -Force
          }
          $vad = 'tools\Whisper.model\ggml-silero-v6.2.0.bin'
          curl.exe -L --fail --retry 3 -o $vad "$env:VAD_MODEL_URL"
          if ($LASTEXITCODE -ne 0) { throw 'Silero VAD 模型下载失败' }
          if ((Get-FileHash $vad -Algorithm SHA256).Hash -ne $env:VAD_MODEL_SHA256) {
            throw 'Silero VAD 模型 SHA256 不匹配'
          }

      - name: Download videocr-cli
        if: env.PADDLEOCR_TAG != ''
        run: |
          New-Item -ItemType Directory -Force -Path downloads, tools | Out-Null
          curl.exe -L --fail --retry 3 -o downloads\videocr-cli.zip "$env:TOOLS_BASE_URL/videocr-cli.zip"
          if ($LASTEXITCODE -ne 0) { throw 'videocr-cli 下载失败' }
          Expand-Archive downloads\videocr-cli.zip -DestinationPath downloads\videocr -Force
          $videocr = Get-ChildItem downloads\videocr -Recurse -File -Filter videocr-cli.exe | Select-Object -First 1
          if (-not $videocr) { throw 'videocr-cli.zip 中未找到 videocr-cli.exe' }
          Copy-Item -LiteralPath $videocr.FullName -Destination tools\videocr-cli.exe -Force

      - name: Download ffmpeg and yt-dlp
        # ffmpeg 优先从 gyan.dev 获取（GitHub Actions 数据中心可能被 Cloudflare 拦截，
        # 失败时自动重试并回退到 BtbN 的 GitHub Release 镜像）；yt-dlp 从其官方 Release 获取
        if: env.PADDLEOCR_TAG != ''
        run: |
          New-Item -ItemType Directory -Force -Path tools | Out-Null

          function Download-WithRetry {
              param(
                  [string]$Url,
                  [string]$OutFile,
                  [int]$Attempts = 3,
                  [int]$MinBytes = 1MB
              )
              for ($i = 1; $i -le $Attempts; $i++) {
                  Write-Host "[$i/$Attempts] Downloading $Url"
                  curl.exe -L --fail -o $OutFile $Url
                  if (Test-Path $OutFile) {
                      $size = (Get-Item $OutFile).Length
                      if ($size -ge $MinBytes) {
                          Write-Host "OK: $([math]::Round($size / 1MB, 1)) MB"
                          return $true
                      }
                      Write-Host "File too small ($size bytes), likely an error page; retrying..."
                      Remove-Item $OutFile -Force -ErrorAction SilentlyContinue
                  }
                  Start-Sleep -Seconds 5
              }
              Write-Host "FAILED: $Url"
              return $false
          }

          $ffmpegOk = $false
          foreach ($src in @(
              "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip",
              "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          )) {
              if (Download-WithRetry -Url $src -OutFile ffmpeg.zip -MinBytes 10MB) {
                  $ffmpegOk = $true
                  break
              }
          }
          if (-not $ffmpegOk) {
              Write-Error "ffmpeg 下载失败：gyan.dev 与 BtbN 镜像均不可用"
              exit 1
          }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extracted -Force
          $ff = Get-ChildItem ffmpeg-extracted -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ff) { Write-Error 'ffmpeg 压缩包中未找到 ffmpeg.exe'; exit 1 }
          Copy-Item $ff.FullName tools\ffmpeg.exe -Force
          Remove-Item ffmpeg.zip, ffmpeg-extracted -Recurse -Force

          if (-not (Download-WithRetry -Url "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile tools\yt-dlp.exe -MinBytes 5MB)) {
              Write-Error "yt-dlp 下载失败"
              exit 1
          }
          Write-Host "tools: $((Get-ChildItem tools -Force | ForEach-Object { $_.Name }) -join ', ')"

      - name: Build Release and create installer
        # 编译与打包都由 package-cpp-release.ps1 完成：
        # 配置/编译 Release -> windeployqt + OpenCV/tools -> ISCC 出 Setup
        run: |
          $params = @(
            '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', '.\package-cpp-release.ps1',
            '-QtRoot', $env:QT_ROOT,
            '-OpenCVDir', $env:OPENCV_DIR,
            '-Generator', $env:CMAKE_GENERATOR,
            '-Setup'
          )
          if ("${{ matrix.variant }}" -eq 'Clear') {
            # Clear 升级主程序与 Whisper/VAD，保留用户现有 OCR 引擎与标识
            $params += @('-NoTools', '-IncludeWhisper', '-Variant', 'Clear')
          } else {
            $params += @('-PaddleOcrTag', $env:PADDLEOCR_TAG)
          }
          & powershell.exe @params
          if ($LASTEXITCODE -ne 0) { Write-Error 'C++ 打包失败'; exit 1 }

      - name: Verify installer and staged payload
        # 三件事：(1) 产物名与版本号/变体严格一致；(2) 非 Clear 包必须带 PADDLEOCR 标识
        # 且第一行内容与变体一致（程序运行期据此定位 tools\<tag> 与机型）；
        # (3) 四包都有 Whisper/VAD；Clear 的 tools 只允许 Whisper/VAD，不带 OCR 标识。
        run: |
          $version = "${{ needs.preflight.outputs.version }}"
          $variant = "${{ matrix.variant }}"
          $setup = "Output\Fairy-Kekkai-Workshop-v$version-$variant-Windows-x86_64-Setup.exe"
          if (-not (Test-Path $setup)) {
            Write-Error "未生成预期安装包: $setup（产物名必须与版本号/变体一致）"
            exit 1
          }
          Write-Host "Installer: $setup ($([math]::Round((Get-Item $setup).Length / 1MB, 1)) MB)"

          $stage = 'dist-cpp\Fairy-Kekkai-Workshop.dist'
          if (-not (Test-Path $stage)) {
            $stage = (Get-ChildItem dist-cpp -Directory -ErrorAction SilentlyContinue |
              Select-Object -First 1).FullName
          }
          if (-not $stage -or -not (Test-Path $stage)) {
            Write-Error '未找到待打包目录 dist-cpp\*，打包步骤可能没有执行成功'
            exit 1
          }
          $stageSize = (Get-ChildItem $stage -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host "Staged payload: $stage ($([math]::Round($stageSize / 1MB, 1)) MB)"

          $marker = Join-Path $stage 'PADDLEOCR'
          $tools = Join-Path $stage 'tools'
          $whisperPayload = @(
            'whisper\whisper-cli.exe', 'whisper\whisper.dll', 'whisper\ggml.dll',
            'whisper\ggml-base.dll', 'whisper\ggml-cpu.dll', 'whisper\ggml-vulkan.dll',
            'Whisper.model\ggml-silero-v6.2.0.bin'
          )
          foreach ($relative in $whisperPayload) {
            if (-not (Test-Path (Join-Path $tools $relative) -PathType Leaf)) {
              throw "待打包目录缺少 tools\$relative"
            }
          }
          $vadFiles = @(Get-ChildItem (Join-Path $tools 'Whisper.model') -File -Recurse)
          if ($vadFiles.Count -ne 1 -or $vadFiles[0].Name -ne 'ggml-silero-v6.2.0.bin') {
            throw 'Whisper.model 只应收录 Silero VAD，不能打入大型转录模型'
          }
          if ($variant -eq 'Clear') {
            if (Test-Path $marker) { Write-Error 'Clear 增量包不应携带 PADDLEOCR 标识文件'; exit 1 }
            foreach ($file in Get-ChildItem $tools -Recurse -File) {
              $relative = [IO.Path]::GetRelativePath((Resolve-Path $tools).Path, $file.FullName)
              if ($relative -notin $whisperPayload) { throw "Clear 包包含不允许的工具文件: $relative" }
            }
            Write-Host 'Clear 校验通过：仅主程序与 Whisper/VAD，不含 PADDLEOCR 标识'
          } else {
            $expected = "PaddleOCR-$variant"
            if (-not (Test-Path $marker)) { Write-Error "缺少 PADDLEOCR 标识文件: $marker"; exit 1 }
            $first = (Get-Content $marker -TotalCount 1).Trim()
            if ($first -ne $expected) {
              Write-Error "PADDLEOCR 第一行是 '$first'，应为 '$expected'"
              exit 1
            }
            foreach ($item in @("tools\$expected", "tools\$env:SUPPORT_DIR",
                                'tools\videocr-cli.exe', 'tools\ffmpeg.exe', 'tools\yt-dlp.exe')) {
              if (-not (Test-Path (Join-Path $stage $item))) {
                Write-Error "待打包目录缺少 $item"; exit 1
              }
            }
            Write-Host "PADDLEOCR 标识校验通过：$first"
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Fairy-Kekkai-Workshop-${{ matrix.variant }}-Windows-x86_64
          path: Output/Fairy-Kekkai-Workshop-v*-Windows-x86_64-Setup.exe
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: [preflight, build]
    # 只有打 tag 才发布；workflow_dispatch 手工触发只产出 artifact
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify release assets
        # 发布说明里列出的安装包必须与实际上传的产物完全一致（多一个少一个都会 404），
        # 并且四个变体各一个、体积不能小得可疑（防止下载到错误页/指针文件）
        run: |
          set -e
          version="${{ needs.preflight.outputs.version }}"
          find release-assets -type f -name '*-Windows-x86_64-Setup.exe' -printf '%f\n' | sort -u > /tmp/actual.txt
          grep -o 'Fairy-Kekkai-Workshop-v[0-9A-Za-z.-]*-Windows-x86_64-Setup\.exe' RELEASE_NOTES.md | sort -u > /tmp/expected.txt
          echo "RELEASE_NOTES.md 中列出的安装包："; cat /tmp/expected.txt
          echo "实际构建出的安装包："; cat /tmp/actual.txt
          if ! diff -u /tmp/expected.txt /tmp/actual.txt; then
            echo "::error::RELEASE_NOTES.md 的下载链接与实际上传的安装包不一致"
            exit 1
          fi

          check() {
            local pattern="$1" label="$2" count
            count=$(find release-assets -type f -name "$pattern" | wc -l)
            if [ "$count" -ne 1 ]; then
              echo "::error::$label 期望 1 个安装包，实际 $count 个（pattern: $pattern）"
              exit 1
            fi
            echo "$label OK"
          }
          check "Fairy-Kekkai-Workshop-v${version}-CPU-v*-Windows-x86_64-Setup.exe" "CPU"
          check "Fairy-Kekkai-Workshop-v${version}-GPU-v*-CUDA-11.8-Windows-x86_64-Setup.exe" "GPU CUDA 11.8"
          check "Fairy-Kekkai-Workshop-v${version}-GPU-v*-CUDA-12.9-Windows-x86_64-Setup.exe" "GPU CUDA 12.9"
          check "Fairy-Kekkai-Workshop-v${version}-Clear-Windows-x86_64-Setup.exe" "Clear"

          tiny=$(find release-assets -type f -name '*-Setup.exe' -size -1M | wc -l)
          if [ "$tiny" -ne 0 ]; then
            echo "::error::有 $tiny 个安装包小于 1MB，疑似无效产物"
            exit 1
          fi
          ls -lh release-assets

      - name: Create GitHub Release
        # 正文即 RELEASE_NOTES.md，客户端「检查更新」直接解析它；
        # 预检已确认它满足契约，这里再传一次是为了防止构建期间文件被改动
        uses: softprops/action-gh-release@v2
        with:
          name: Fairy Kekkai Workshop ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: release-assets/*-Setup.exe
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
